title: Programowanie obiektowe w języku Java
description: Instrukcje laboratoryjne z programowania obiektowego dla kierunku Informatyka i ekonometria.
lang: pl-PL
url: https://po2-java.lazysolutions.pl
baseurl: ""

remote_theme: wgalka/instructions-jekyll-theme

plugins:
  - jekyll-remote-theme

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - priv
  - prv
  - .agents
  - AGENTS.md
  - agents.md
  - target
  - out
